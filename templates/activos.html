{% extends "base.html" %}
{% block content %}
<h1>Vehículos Activos</h1>

<table>
  <tr>
    <th>Placa</th>
    <th>Tipo</th>
    <th>Entrada</th>
  </tr>

  {% for v in vehiculos %}
  <tr>
    <td>{{ v.placa }}</td>
    <td>{{ v.tipo }}</td>
    <td>{{ v.entrada }}</td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
