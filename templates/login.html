<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – Parqueadero El Puente</title>

    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2898/2898588.png">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/2898/2898588.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="El Puente">
    <meta name="mobile-web-app-capable" content="yes">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        /* Refuerzo para asegurar que el login siempre esté centrado y pequeño */
        .login-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f1117; /* Color de fondo consistente */
            padding: 1.5rem;
        }
        .login-box {
            width: 100%;
            max-width: 380px; /* Tamaño ideal para que se vea centrado en PC */
            background: #1a1d27;
            padding: 2.5rem;
            border-radius: 12px;
            border: 1px solid #2e3347;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>
<div class="login-wrap">
  <div class="login-box">
    <div class="login-logo" style="text-align: center; margin-bottom: 2rem; font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 2rem;">
        <span style="color: #00e5a0;">🅿️</span> <span style="color: #e8eaf0;">El Puente</span>
    </div>

    {% if error %}
    <div class="alert alert-error" style="padding: 10px; margin-bottom: 1.5rem; border-radius: 8px; background: rgba(255,71,87,0.1); color: #ff4757; border: 1px solid #ff4757; text-align: center; font-size: 0.9rem;">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group" style="margin-bottom: 1.2rem;">
        <label style="display: block; color: #8891a8; margin-bottom: 0.5rem; font-size: 0.9rem; font-weight: 600;">Usuario</label>
        <input name="username" class="form-control" placeholder="usuario" autofocus required>
      </div>
      <div class="form-group" style="margin-bottom: 1.5rem;">
        <label style="display: block; color: #8891a8; margin-bottom: 0.5rem; font-size: 0.9rem; font-weight: 600;">Contraseña</label>
        <input name="password" type="password" class="form-control" placeholder="••••••" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" style="width: 100%; padding: 0.8rem; background: #00e5a0; color: #000; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 1rem;">
          Ingresar →
      </button>
    </form>
  </div>
</div>
</body>
</html>
