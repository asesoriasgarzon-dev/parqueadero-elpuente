<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login – Parqueadero El Puente</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="login-wrap">
  <div class="login-box">
    <div class="login-logo">🅿️ <span>El Puente</span></div>
    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}
    <form method="POST">
      <div class="form-group">
        <label>Usuario</label>
        <input name="username" class="form-control" placeholder="usuario" autofocus>
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input name="password" type="password" class="form-control" placeholder="••••••">
      </div>
      <button type="submit" class="btn btn-primary btn-block" style="margin-top:1rem">Ingresar →</button>
    </form>
  </div>
</div>
</body>
</html>
